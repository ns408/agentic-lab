name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and format (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Runs the exact same .pre-commit-config.yaml as local: ruff, ruff-format,
      # gitleaks (diff), file hygiene. Zero config drift between local and CI.
      - uses: pre-commit/action@v3.0.1

  types-tests:
    name: types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: mypy .
      - run: pytest -q

  security:
    name: security (bandit + gitleaks history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "bandit[toml]"
      - run: bandit -r . -c pyproject.toml
      - name: gitleaks (full history)
        # Direct scan of this repo's whole commit history; deterministic and matches
        # the local pre-commit/pre-publish gitleaks. (The gitleaks-action builds an
        # invalid commit range on the first push from the root commit.)
        run: |
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner
